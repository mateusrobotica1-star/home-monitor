<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor da Casa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
        }
        header h1 { font-size: 24px; }
        .status-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            background: #f44336;
        }
        .status-dot.online { background: #4caf50; }
        .status-text { font-size: 14px; color: #aaa; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .card .label { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .card .value { font-size: 48px; font-weight: 700; margin: 10px 0; }
        .card .unit { font-size: 20px; color: #aaa; font-weight: 400; }
        .card .icon { font-size: 28px; margin-bottom: 8px; }
        .update-info { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }
        .chart-container {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .chart-container canvas { max-height: 300px; touch-action: none; }
        .loading { text-align: center; padding: 40px; color: #aaa; }
        .error { text-align: center; padding: 40px; color: #f44336; }
        footer { text-align: center; margin-top: 40px; color: #666; font-size: 12px; }

        /* ===== Tela de Login ===== */
        #telaLogin {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #telaLogin.visivel { display: flex; }
        .login-box {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 40px 35px;
            width: 100%;
            max-width: 340px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .login-box h2 { margin-bottom: 5px; font-size: 22px; }
        .login-box .sub { color: #aaa; font-size: 13px; margin-bottom: 25px; }
        .login-box input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .login-box input::placeholder { color: #888; }
        .login-box input:focus { border-color: #7c6ce0; }
        .login-box button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #7c6ce0;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-box button:hover { background: #6b5cd6; }
        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }

        /* ===== Alerta de som ===== */
        .alerta-som {
            display: none;
            margin: 15px 0;
            padding: 14px 18px;
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid #f44336;
            border-left: 5px solid #f44336;
            border-radius: 10px;
            color: #ffb4ab;
            font-weight: 600;
            font-size: 15px;
            animation: piscar 1.2s infinite;
        }
        .alerta-som.ativo { display: block; }
        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        /* ===== Responsivo para celular ===== */
        @media (max-width: 600px) {
            .container { padding: 14px; }
            header { flex-direction: column; align-items: flex-start; gap: 12px; }
            header h1 { font-size: 20px; }
            .cards { grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0; }
            .card { padding: 16px 8px; }
            .card .value { font-size: 30px; }
            .card .value.som { font-size: 24px; }
            .chart-container { padding: 10px 6px; overflow: hidden; }
            .chart-container canvas {
                max-height: 420px;
                width: 100% !important;
            }
            .chart-container #grafico { height: 340px !important; }
            .chart-container .chart-help { font-size: 11px; flex-wrap: wrap; gap: 6px !important; }
        }
        @media (max-width: 360px) {
            .card .value { font-size: 26px; }
        }
    </style>
</head>
<body>
    <!-- Tela de Login -->
    <div id="telaLogin">
        <div class="login-box">
            <h2>🏠 Monitor da Casa</h2>
            <div class="sub">Entre para acessar o painel</div>
            <form id="formLogin" autocomplete="off">
                <input type="text" id="loginUser" placeholder="Usuário">
                <input type="password" id="loginPass" placeholder="Senha">
                <button type="submit">Entrar</button>
            </form>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <div class="container" id="dashboard">
        <header>
            <h1>🏠 Monitor da Casa</h1>
            <div>
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">Verificando...</span>
                <button id="btnSair" style="margin-left:15px;background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;">Sair</button>
            </div>
        </header>

        <div class="alerta-som" id="alertaSom">🔔 Som alto detectado no quarto!</div>

        <div class="cards">
            <div class="card">
                <div class="icon">🌡️</div>
                <div class="label">Temperatura</div>
                <div class="value"><span id="temp">--</span><span class="unit">°C</span></div>
            </div>
            <div class="card">
                <div class="icon">💧</div>
                <div class="label">Umidade</div>
                <div class="value"><span id="umid">--</span><span class="unit">%</span></div>
            </div>
            <div class="card">
                <div class="icon">🔊</div>
                <div class="label">Som</div>
                <div class="value som" style="font-size: 30px;"><span id="som">--</span></div>
            </div>
            <div class="card">
                <div class="icon">📍</div>
                <div class="label">Local</div>
                <div class="value" style="font-size: 24px;">Quarto</div>
            </div>
        </div>

        <div class="update-info" id="updateInfo">Aguardando atualização...</div>

        <div class="chart-container">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;color:#aaa;" class="chart-help">
            <span>👆 1 dedo: navegar · 🤏 2 dedos: dar zoom</span>
            <button id="btnBaixar" title="Baixar grafico como imagem" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;">⬇ Baixar</button>
            <button id="btnResetZoom" title="Voltar ao inicio" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;">↺ Resetar</button>
        </div>
            <canvas id="grafico"></canvas>
        </div>

        <footer>Desenvolvido com ESP32-S3 + Supabase + Render</footer>
    </div>

    <script>
        // ========================================
        // CONFIGURAÇÃO - ALTERE AQUI!
        // URL do seu backend na Render
        // ========================================
        const API_URL = 'https://home-monitor-backend.onrender.com/api';
        const INTERVALO_ATUALIZACAO = 10000; // 10 segundos
        const SOM_LIMITE_ALERTA = 300; // limite para alerta de som (mesmo do ESP32)

        // Registra o plugin de zoom (obrigatório para pinch/pan funcionarem)
        if (typeof ChartZoom !== 'undefined') {
            Chart.register(ChartZoom);
        } else if (window.ChartZoom !== undefined) {
            Chart.register(window.ChartZoom);
        }

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const updateInfo = document.getElementById('updateInfo');

        let chart = null;

        // Descreve o possível tipo de som com base no nível
        function descreverSom(nivel) {
            if (nivel >= 3500) return 'possível passos ou batida forte';
            if (nivel >= 2500) return 'possível porta batendo ou objeto caindo';
            if (nivel >= 1500) return 'possível conversa alta ou TV';
            if (nivel >= 800) return 'possível conversa normal ou fala';
            if (nivel >= SOM_LIMITE_ALERTA) return 'barulho moderado';
            return 'nível de som';
        }

        // Formata data e hora em pt-BR
        function formatarData(isoString) {
            const data = new Date(isoString);
            return data.toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Atualiza o status online/offline
        function atualizarStatus(online, texto) {
            statusDot.className = 'status-dot' + (online ? ' online' : '');
            statusText.textContent = texto;
        }

        // Retorna o cabeçalho de autorização com o token
        function cabAutorizacao() {
            const token = sessionStorage.getItem('token');
            return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        }

        // Busca a última leitura
        async function buscarAtual() {
            try {
                const res = await fetch(`${API_URL}/temperatura/atual`, { headers: cabAutorizacao() });
                if (res.status === 404) {
                    // Nenhuma leitura ainda - aguardando o sensor
                    document.getElementById('temp').textContent = '--';
                    document.getElementById('umid').textContent = '--';
                    updateInfo.textContent = 'Aguardando dados do sensor...';
                    atualizarStatus(false, 'Aguardando dados');
                    return;
                }
                if (!res.ok) throw new Error('Erro na API');
                const dados = await res.json();

                document.getElementById('temp').textContent = dados.temperatura.toFixed(1);
                document.getElementById('umid').textContent = dados.umidade.toFixed(1);

                // Mostra o nível de som e aciona o alerta se alto
                const nivelSom = dados.som !== undefined ? dados.som : 0;
                document.getElementById('som').textContent = nivelSom;
                const alertaEl = document.getElementById('alertaSom');
                if (nivelSom > SOM_LIMITE_ALERTA) {
                    alertaEl.textContent = '🔊 Som alto detectado no quarto! (' + descreverSom(nivelSom) + ')';
                    alertaEl.classList.add('ativo');
                } else {
                    alertaEl.classList.remove('ativo');
                }

                const atualizado = formatarData(dados.criado_em);
                updateInfo.textContent = `Última atualização: ${atualizado}`;

                // Verifica se o módulo está ativo (envia a cada 30s)
                // Se passou mais de 1 minuto sem dado, considera o módulo desligado
                const agora = new Date();
                const ultima = new Date(dados.criado_em);
                const diffMin = (agora - ultima) / 60000;

                if (diffMin <= 1) {
                    atualizarStatus(true, 'Módulo online');
                } else {
                    atualizarStatus(false, 'Módulo desligado');
                }

            } catch (error) {
                atualizarStatus(false, 'Erro de conexão');
                console.error(error);
            }
        }

        // Busca o histórico e desenha o gráfico
        async function buscarHistorico() {
            try {
                const res = await fetch(`${API_URL}/leituras?limite=24`, { headers: cabAutorizacao() });
                if (!res.ok) throw new Error('Erro na API');
                const dados = await res.json();

                // Inverte para ordem cronológica
                const ordenado = dados.reverse();

                const labels = ordenado.map(d => formatarData(d.criado_em));
                const temperaturas = ordenado.map(d => d.temperatura);
                const umidades = ordenado.map(d => d.umidade);
                const sons = ordenado.map(d => d.som !== undefined ? d.som : 0);
                const limitesSom = ordenado.map(() => SOM_LIMITE_ALERTA);

                if (chart) {
                    chart.destroy();
                }

                const ctx = document.getElementById('grafico').getContext('2d');
                const ehMobile = window.innerWidth <= 600;
                const graficoCanvas = document.getElementById('grafico');
                // Garante que o browser nao roube o toque para zoom de pagina no canvas
                if (graficoCanvas) {
                    graficoCanvas.style.touchAction = 'none';
                    graficoCanvas.style.userSelect = 'none';
                    const wrapper = graficoCanvas.parentElement;
                    if (wrapper) wrapper.style.touchAction = 'none';
                }
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Temperatura (°C)',
                                data: temperaturas,
                                borderColor: '#ff6384',
                                backgroundColor: 'rgba(255,99,132,0.1)',
                                yAxisID: 'yTemp',
                                tension: 0.3
                            },
                            {
                                label: 'Umidade (%)',
                                data: umidades,
                                borderColor: '#36a2eb',
                                backgroundColor: 'rgba(54,162,235,0.1)',
                                yAxisID: 'yUmid',
                                tension: 0.3
                            },
                            {
                                label: 'Som',
                                data: sons,
                                borderColor: '#ffce56',
                                backgroundColor: 'rgba(255,206,86,0.15)',
                                yAxisID: 'ySom',
                                tension: 0.3
                            },
                            {
                                label: 'Limite som',
                                data: limitesSom,
                                borderColor: 'rgba(255,206,86,0.4)',
                                borderDash: [5, 5],
                                pointRadius: 0,
                                borderWidth: 1,
                                yAxisID: 'ySom'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: !ehMobile,
                        plugins: {
                            legend: {
                                labels: { color: '#fff', boxWidth: ehMobile ? 10 : 40, font: { size: ehMobile ? 10 : 12 }, padding: ehMobile ? 8 : 10 }
                            },
                            title: {
                                display: true,
                                text: 'Histórico do Quarto (últimas 24h)',
                                color: '#fff',
                                font: { size: ehMobile ? 12 : 16 }
                            },
                            zoom: {
                                zoom: {
                                    wheel: { enabled: true, speed: 0.03 },
                                    pinch: {
                                        enabled: true,
                                        speed: 0.01,
                                        threshold: 0.2
                                    },
                                    mode: 'x',
                                    limits: {
                                        x: { min: 'original', max: 'original', minRange: 3 },
                                        y: { max: 'original', min: 'original' }
                                    }
                                },
                                pan: {
                                    enabled: true,
                                    mode: 'x',
                                    threshold: 30,
                                    modifierKey: undefined
                                }
                            }
                        },
                        scales: {
                            x: { ticks: { color: '#aaa', maxTicksLimit: ehMobile ? 6 : 12, font: { size: ehMobile ? 9 : 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
                            yTemp: {
                                type: 'linear',
                                position: 'left',
                                title: { display: true, text: '°C', color: '#ff6384', font: { size: ehMobile ? 9 : 11 } },
                                ticks: { color: '#ff6384', font: { size: ehMobile ? 9 : 11 } },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            },
                            yUmid: {
                                type: 'linear',
                                position: 'right',
                                min: 0,
                                max: 100,
                                title: { display: true, text: '%', color: '#36a2eb', font: { size: ehMobile ? 9 : 11 } },
                                ticks: { color: '#36a2eb', font: { size: ehMobile ? 9 : 11 } },
                                grid: { drawOnChartArea: false }
                            },
                            ySom: {
                                type: 'linear',
                                position: 'right',
                                title: { display: true, text: 'Som', color: '#ffce56', font: { size: ehMobile ? 9 : 11 } },
                                ticks: { color: '#ffce56', font: { size: ehMobile ? 9 : 11 } },
                                grid: { drawOnChartArea: false }
                            }
                        }
                    }
                });

                // Botão resetar zoom
                document.getElementById('btnResetZoom').onclick = function () {
                    if (chart) chart.resetZoom();
                };

                // Botão baixar gráfico como imagem
                document.getElementById('btnBaixar').onclick = function () {
                    if (!chart) return;
                    const link = document.createElement('a');
                    link.download = 'grafico-monitor.png';
                    link.href = chart.toBase64Image('image/png', 1);
                    link.click();
                };

            } catch (error) {
                console.error('Erro ao buscar histórico:', error);
            }
        }

        // Inicia a aplicação (dashboard)
        function iniciar() {
            document.getElementById('telaLogin').classList.remove('visivel');
            document.getElementById('dashboard').style.display = 'block';
            atualizarStatus(true, 'Conectando...');
            buscarAtual();
            buscarHistorico();
            setInterval(buscarAtual, 5000);  // checa a cada 5s (status responde rapido)
            setInterval(buscarHistorico, INTERVALO_ATUALIZACAO * 2);
        }

        // ===== LOGIN (autenticado no backend) =====

        // Mostra a tela de login se não estiver logado
        function verificarLogin() {
            if (sessionStorage.getItem('logado') === 'sim' && sessionStorage.getItem('token')) {
                iniciar();
            } else {
                document.getElementById('telaLogin').classList.add('visivel');
                document.getElementById('dashboard').style.display = 'none';
            }
        }

        // Processa o envio do formulário de login
        document.getElementById('formLogin').addEventListener('submit', async function (e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const btn = document.querySelector('#formLogin button');
            const erroEl = document.getElementById('loginError');

            erroEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: user, senha: pass })
                });

                if (res.ok) {
                    const dados = await res.json();
                    sessionStorage.setItem('logado', 'sim');
                    sessionStorage.setItem('token', dados.token);
                    iniciar();
                } else {
                    erroEl.textContent = 'Usuário ou senha incorretos!';
                }
            } catch (err) {
                erroEl.textContent = 'Erro de conexão. Tente novamente.';
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });

        // Botão Sair - desloga e volta para a tela de login
        document.getElementById('btnSair').addEventListener('click', function () {
            sessionStorage.removeItem('logado');
            sessionStorage.removeItem('token');
            document.getElementById('telaLogin').classList.add('visivel');
            document.getElementById('dashboard').style.display = 'none';
        });

        verificarLogin();
    </script>
</body>
</html>
